<div class="wrap">
  <div class="hero">
    <h1>Chapter 45: Musculoskeletal</h1>
    <p>100-question interactive NCLEX / HESI / ATI / Kaplan-style study exam. Instant feedback, rationale, and final score.</p>
  </div>
  <div class="card" id="app"></div>
  <div class="footer">Study quiz based on the Chapter 45 material used to create the original practice questions.</div>
</div>
<script>
const Q=[
{q:"A nursing student is reviewing the functions of the skeletal system. Which statement demonstrates correct understanding?",o:["The skeleton primarily functions to produce body heat and regulate body temperature.","Red bone marrow in certain bones is responsible for blood cell formation.","Calcium stored in the bones cannot be released once bone growth is complete.","The skeleton moves independently of the nervous and respiratory systems."],a:1,r:"Red bone marrow is hematopoietic tissue and produces blood cells. Muscle is a major contributor to heat production, and bone calcium can be released through resorption."},
{q:"The nurse is teaching a student about osteoblasts and osteoclasts. Which statement is correct?",o:["Osteoclasts produce new bone matrix during fracture healing.","Osteoblasts break down bone to release calcium into the blood.","Osteoblasts produce bone matrix, while osteoclasts resorb bone.","Osteoblasts and osteoclasts perform the same function."],a:2,r:"Osteoblasts build bone matrix; osteoclasts resorb or break down bone."},
{q:"Which nutrient is essential for efficient absorption of calcium and phosphorus in the small intestine?",o:["Vitamin A","Vitamin C","Vitamin D","Vitamin K"],a:2,r:"Vitamin D supports efficient intestinal absorption of calcium and phosphorus."},
{q:"Which hormone increases the removal of calcium and phosphate from bones?",o:["Calcitonin","Parathyroid hormone","Insulin","Growth hormone"],a:1,r:"Parathyroid hormone promotes removal of calcium and phosphate from bone; calcitonin promotes calcium retention."},
{q:"Which statement about the structure of a long bone is correct?",o:["The epiphysis is the shaft of the long bone.","The diaphysis is composed only of spongy bone.","The diaphysis is the shaft, and the epiphyses are the ends of the bone.","The periosteum covers the joint surfaces of long bones."],a:2,r:"The diaphysis is the shaft and the epiphyses are the ends. Articular cartilage covers joint surfaces."},
{q:"Which structure primarily connects bone to bone?",o:["Tendon","Ligament","Fascia","Bursa"],a:1,r:"Ligaments connect bone to bone. Tendons connect muscle to bone."},
{q:"Why are bursae important in synovial joints?",o:["They connect muscles directly to bones.","They produce red blood cells.","They reduce friction between the joint and structures that move across it.","They prevent all movement of the joint."],a:2,r:"Bursae are synovial-fluid-filled sacs that reduce friction and wear."},
{q:"Which joint allows movement in all planes?",o:["Hinge joint","Pivot joint","Ball-and-socket joint","Gliding joint"],a:2,r:"Ball-and-socket joints, such as the hip and shoulder, move in all planes."},
{q:"Which joint is correctly matched with its type of movement?",o:["Elbow — pivot","Atlas and axis — hinge","Carpals of the wrist — gliding","Hip — saddle"],a:2,r:"Carpal joints are gliding joints. The elbow is hinge, atlas-axis is pivot, and hip is ball-and-socket."},
{q:"Which neurotransmitter is released by the motor neuron to initiate skeletal muscle contraction?",o:["Dopamine","Serotonin","Acetylcholine","Norepinephrine"],a:2,r:"Acetylcholine is released at the neuromuscular junction and binds receptors on the sarcolemma."},
{q:"Which event occurs immediately after calcium is released from the sarcoplasmic reticulum?",o:["Acetylcholine is released into the synaptic cleft.","Calcium binds to troponin on the actin filament.","Myosin detaches permanently from actin.","The motor neuron stops transmitting impulses."],a:1,r:"Calcium binds troponin, exposing actin binding sites so myosin can interact and contraction can occur."},
{q:"Which structure is responsible for coordinating voluntary movement?",o:["Frontal lobe","Cerebellum","Medulla oblongata","Hypothalamus"],a:1,r:"The cerebellum coordinates voluntary movement; motor impulses originate in motor areas of the frontal lobes."},
{q:"Which statement about muscle tone is correct?",o:["Muscle tone is the complete relaxation of skeletal muscles.","Muscle tone is the slight contraction normally present in muscles.","Muscle tone occurs only during exercise.","Muscle tone is controlled only by conscious thought."],a:1,r:"Muscle tone is a slight ongoing contraction that supports posture and coordination."},
{q:"A postmenopausal patient asks what can help reduce age-related loss of bone density. Which intervention is most appropriate?",o:["Avoiding weight-bearing activity","Increasing bed rest","Participating in regular weight-bearing exercise","Limiting all calcium-containing foods"],a:2,r:"Weight-bearing exercise stimulates bone matrix deposition and helps maintain bone density."},
{q:"An older adult reports increasing joint stiffness and discomfort with movement. Which age-related change best explains this?",o:["Increased synovial fluid production","Thickening and smoothing of articular cartilage","Wearing down and roughening of articular cartilage","Increased protein synthesis in skeletal muscle"],a:2,r:"With aging, articular cartilage can wear down and become rough, causing pain and stiffness."},
{q:"Which finding is expected as part of normal aging of the musculoskeletal system?",o:["Increased muscle strength from increased protein synthesis","Decreased muscle strength related to reduced protein synthesis","Increased bone calcium after menopause","Complete loss of muscle tone"],a:1,r:"Muscle strength declines with age as protein synthesis decreases."},
{q:"Which question best assesses the psychosocial impact of a chronic musculoskeletal disorder?",o:["When was your last tetanus vaccination?","How has this condition affected your work, social activities, or self-image?","How many glasses of water do you drink each day?","Do you usually sleep on your back or your side?"],a:1,r:"Musculoskeletal disorders can affect work, socialization, body image, coping, and support systems."},
{q:"Which information is subjective data when assessing musculoskeletal pain?",o:["The patient’s description of how the pain affects daily activities","The nurse’s observation of joint swelling","The measured range of motion of the affected joint","The presence of crepitus during movement"],a:0,r:"Subjective data are reported by the patient; observed or measured findings are objective."},
{q:"Which statement about muscle attachments is correct?",o:["The insertion is the more stationary attachment of a muscle.","The origin is the more movable attachment of a muscle.","The origin is usually the more stationary attachment, and the insertion is the more movable attachment.","Both origin and insertion are attached to the same bone."],a:2,r:"Origin is usually the more stationary attachment; insertion is the more movable attachment."},
{q:"Which term describes the muscle primarily responsible for producing a specific movement?",o:["Antagonist","Agonist","Synergist","Flexor"],a:1,r:"The agonist is the prime mover for a specific action."},
{q:"Which statement about synergist muscles is correct?",o:["They prevent all movement at a joint.","They oppose every action of the agonist.","They assist movement and help provide balance and fine motor control.","They attach only to the axial skeleton."],a:2,r:"Synergists cooperate with the agonist and support balance and fine motor control."},
{q:"Which statement about the periosteum is correct?",o:["It covers the ends of bones at the joints and reduces friction.","It covers most outer bone surfaces and contributes to bone growth, repair, and blood supply.","It is found only inside the epiphyses of long bones.","It primarily stores synovial fluid."],a:1,r:"The periosteum covers most outer bone surfaces and supports protection, growth, repair, and blood supply."},
{q:"Which cell is primarily responsible for resorbing bone when the body needs more calcium in the blood?",o:["Osteocyte","Osteoblast","Osteoclast","Chondrocyte"],a:2,r:"Osteoclasts resorb bone and can release minerals such as calcium into the blood."},
{q:"Which hormone promotes retention of calcium in the bones?",o:["Parathyroid hormone","Calcitonin","Growth hormone","Insulin"],a:1,r:"Calcitonin promotes calcium retention in bone."},
{q:"Which skeletal structure primarily protects the heart and lungs from mechanical injury?",o:["Vertebral column","Pelvic girdle","Thoracic cage","Scapula"],a:2,r:"The thoracic cage protects the heart and lungs and contributes to breathing mechanics."},
{q:"Which part of the vertebral column contains the largest and strongest vertebrae?",o:["Cervical","Thoracic","Lumbar","Coccygeal"],a:2,r:"The five lumbar vertebrae are the largest and strongest."},
{q:"Which statement about the atlas and axis is correct?",o:["The atlas is the second cervical vertebra.","The axis articulates directly with the occipital bone.","The atlas is the first cervical vertebra and forms a pivot joint with the axis.","Both are thoracic vertebrae."],a:2,r:"The atlas is C1 and forms a pivot joint with the axis, C2."},
{q:"Which structure cushions the vertebrae and permits movement of the spinal column?",o:["Periosteum","Intervertebral discs","Bursae","Tendons"],a:1,r:"Intervertebral discs cushion adjacent vertebrae and permit spinal movement."},
{q:"Which type of joint allows rotation?",o:["Hinge","Pivot","Saddle","Symphysis"],a:1,r:"Pivot joints allow rotation, such as the atlas-axis joint."},
{q:"Which type of joint allows movement primarily in one plane?",o:["Ball-and-socket","Hinge","Saddle","Gliding"],a:1,r:"Hinge joints move primarily in one plane, such as the elbow and knee."},
{q:"Which statement about the axial skeleton is correct?",o:["It consists mainly of the upper and lower extremities.","It includes flat and irregular bones that contain red bone marrow.","It contains only long bones.","It does not contribute to protection of internal organs."],a:1,r:"The axial skeleton includes many flat and irregular bones and contributes to protection and hematopoiesis."},
{q:"Which bone is part of the appendicular skeleton?",o:["Sternum","Vertebra","Femur","Rib"],a:2,r:"The femur is a limb bone and therefore part of the appendicular skeleton."},
{q:"Which statement best describes the function of articular cartilage?",o:["It produces red blood cells.","It connects muscle to bone.","It cushions joints and reduces friction.","It covers the entire outer surface of bone."],a:2,r:"Articular cartilage cushions joint surfaces and reduces friction."},
{q:"Which function of skeletal muscle helps support venous return from the legs?",o:["Producing synovial fluid","Compressing the leg veins during muscle contraction","Increasing bone resorption","Stimulating red blood cell production"],a:1,r:"Muscle contraction compresses leg veins and helps propel venous blood toward the heart."},
{q:"Which statement about bone remodeling is correct?",o:["Bone remodeling stops once adult height is reached.","Calcium and phosphate are continuously removed and replaced in bone.","Only osteoblasts participate in remodeling.","Remodeling occurs only after a fracture."],a:1,r:"Bone remains metabolically active throughout life, with continuous removal and replacement of minerals."},
{q:"A child lacks the hormone that normally increases mitosis and protein synthesis, resulting in slower skeletal growth. Which hormone is deficient?",o:["Calcitonin","Growth hormone","Parathyroid hormone","Aldosterone"],a:1,r:"Growth hormone from the anterior pituitary increases mitosis and protein synthesis."},
{q:"Which hormone stimulates osteoblasts and increases energy production during bone growth?",o:["Thyroxine","Calcitonin","Parathyroid hormone","Aldosterone"],a:0,r:"Thyroxine stimulates osteoblasts and increases energy production."},
{q:"Which statement about skeletal muscle fibers is correct?",o:["Each muscle fiber receives its own motor nerve ending.","All muscle fibers in a muscle always contract at the same time.","Muscle fibers are attached to bone by ligaments.","The number of contracting muscle fibers does not change with workload."],a:0,r:"Each skeletal muscle fiber receives a motor nerve ending, and recruitment increases with workload."},
{q:"A motor neuron releases acetylcholine at the neuromuscular junction. What happens next?",o:["Calcium immediately leaves the bloodstream and enters bone.","Acetylcholine binds receptors on the sarcolemma.","Myosin releases calcium into the synaptic cleft.","Troponin releases acetylcholine."],a:1,r:"ACh diffuses across the synaptic cleft and binds receptors on the sarcolemma."},
{q:"A patient has damage to the cerebellum. Which finding would the nurse most expect?",o:["Difficulty coordinating voluntary movements","Inability to produce acetylcholine","Increased bone resorption","Loss of red bone marrow production"],a:0,r:"The cerebellum coordinates voluntary movement."},
{q:"Which finding is most consistent with normal age-related musculoskeletal changes?",o:["Increased bone density after menopause","Increased protein synthesis and muscle strength","Roughening of articular cartilage with joint stiffness","Increased calcium deposition regardless of activity level"],a:2,r:"Aging commonly causes roughening and wear of articular cartilage with pain and stiffness."},
{q:"Which statement about the sternum and ribs is correct?",o:["They are part of the appendicular skeleton.","They form part of the thoracic cage.","They primarily allow movement in all planes.","They are classified as long bones."],a:1,r:"The sternum and 12 pairs of ribs form the thoracic cage."},
{q:"Which structure connects muscle to bone?",o:["Ligament","Tendon","Bursa","Cartilage"],a:1,r:"Tendons connect muscle to bone."},
{q:"A patient reports chronic musculoskeletal pain that has caused them to stop working and avoid social activities. Which nursing assessment is most important?",o:["Ask only about the pain location and intensity.","Assess coping strategies, support systems, and psychological effects.","Focus only on range of motion.","Delay psychosocial questions until after diagnostic testing."],a:1,r:"Chronic musculoskeletal disorders can significantly affect coping, support systems, work, socialization, and self-concept."},
{q:"Which statement about synovial joints is correct?",o:["They are immovable joints found between the cranial bones.","They are freely movable joints.","They contain no fluid-filled structures.","They are found only in the vertebral column."],a:1,r:"Freely movable joints (diarthroses) are synovial joints."},
{q:"Which statement about the periosteum is correct?",o:["It covers the bone surfaces inside synovial joints.","It helps with bone growth and fracture repair.","It is the main site of red blood cell production.","It connects bone to bone."],a:1,r:"The periosteum supports bone growth, repair, protection, and blood supply."},
{q:"Which nutrients provide the main raw materials for bone matrix formation?",o:["Sodium, potassium, and vitamin K","Calcium, phosphorus, and protein","Iron, folate, and vitamin B12","Magnesium, sodium, and glucose"],a:1,r:"Calcium, phosphorus, and protein are major raw materials for bone matrix."},
{q:"Which statement about calcitonin and parathyroid hormone (PTH) is correct?",o:["Both hormones increase calcium removal from bone.","Calcitonin promotes calcium retention in bone, while PTH promotes calcium removal from bone.","PTH promotes calcium retention in bone, while calcitonin removes calcium from bone.","Neither hormone affects bone remodeling."],a:1,r:"Calcitonin favors calcium retention in bone; PTH promotes calcium and phosphate removal."},
{q:"Which statement about the thoracic cage is correct?",o:["It consists of 10 pairs of ribs and the clavicles.","It protects the heart and lungs and assists with inhalation.","It contains only appendicular bones.","It prevents movement of the chest during breathing."],a:1,r:"The thoracic cage protects vital organs and moves upward and outward during inhalation."},
{q:"A nurse is collecting a musculoskeletal health history from a patient with chronic pain and deformity. Which assessment question is most appropriate?",o:["How has this condition affected your daily activities, work, and social life?","Do you have bowel sounds in all four quadrants?","Have you noticed any changes in your hearing?","When was your last eye examination?"],a:0,r:"A musculoskeletal history should include the condition’s impact on function, work, social life, body image, coping, and support."},

{q:"A nurse is performing a musculoskeletal physical examination. Which three areas are most important to assess?",o:["Inspection, range of motion, and muscle tone/palpation","Auscultation, percussion, and reflexes","Vision, hearing, and gait only","Skin turgor, bowel sounds, and capillary refill"],a:0,r:"Objective musculoskeletal data collection focuses on inspection, range of motion, and muscle tone/palpation."},
{q:"A nurse is assessing a patient’s gait. Which finding should be documented as an abnormal musculoskeletal finding?",o:["Symmetrical arm swing","Smooth, steady gait","Limping while walking","Equal step length"],a:2,r:"Limping is an alteration in gait and should be documented."},
{q:"The nurse asks a patient to touch each fingertip to the thumb one at a time. What is this movement called?",o:["Abduction","Opposition","Extension","Rotation"],a:1,r:"Touching each fingertip to the thumb is opposition and helps assess hand range of motion."},
{q:"A nurse is assessing bilateral upper-extremity muscle strength. Which action is most appropriate?",o:["Ask the patient to shrug the shoulders","Ask the patient to grip both of the nurse’s hands","Measure the circumference of each arm","Palpate the radial pulse only"],a:1,r:"Bilateral hand grips allow comparison of strength and equality."},
{q:"A patient with a recent fracture is at risk for impaired circulation. Which assessment should the nurse perform frequently?",o:["Bowel sounds","Neurovascular checks","Visual acuity","Hearing assessment"],a:1,r:"Fractures and musculoskeletal surgery can impair circulation, so frequent neurovascular checks are needed."},
{q:"A patient with a lower-leg fracture reports severe pain that is disproportionate to the injury and is not relieved by narcotic medication. Which finding is most concerning?",o:["Expected postoperative discomfort","Possible neurovascular compromise","Mild muscle fatigue","Normal swelling after injury"],a:1,r:"Pain out of proportion and unrelieved by opioids is a serious neurovascular warning sign, including possible compartment syndrome."},
{q:"Which capillary refill finding should the nurse report?",o:["Nailbed blanches and returns to color in 1 second","Nailbed blanches and returns to color in 2 seconds","Nailbed does not blanch/return to normal within 3–5 seconds","Nailbed is pink and warm"],a:2,r:"Delayed capillary refill can indicate impaired circulation."},
{q:"Which laboratory value is most closely associated with bone-forming activity and may increase with bone damage, metabolic bone disease, or bone cancer?",o:["Uric acid","Alkaline phosphatase","Myoglobin","Creatine kinase"],a:1,r:"ALP reflects osteoblast activity and may rise with new bone formation and certain bone disorders."},
{q:"A patient has significant skeletal muscle injury. Which laboratory findings should the nurse expect to be elevated?",o:["CK and myoglobin","Uric acid and calcium only","ALP and phosphorus only","Hemoglobin and bilirubin"],a:0,r:"Skeletal muscle damage releases CK and myoglobin into the blood."},
{q:"An older adult fell at home and remained on the floor for several hours. The patient now has dark urine, muscle weakness, and myalgia. Which condition should the nurse suspect?",o:["Gout","Rhabdomyolysis","Osteoporosis","Bursitis"],a:1,r:"Prolonged muscle compression can cause rhabdomyolysis, with dark urine, weakness, myalgia, and elevated CK."},
{q:"A patient with rhabdomyolysis is being monitored. Which laboratory value is especially important because it may become elevated and contribute to dangerous cardiac effects?",o:["Potassium","Sodium","Chloride","Bicarbonate"],a:0,r:"Muscle cell destruction can release potassium, increasing the risk of hyperkalemia."},
{q:"In a healthy person, what relationship normally exists between serum calcium and phosphorus?",o:["They rise and fall together.","They have an inverse relationship.","Calcium remains constant while phosphorus changes.","Phosphorus remains constant while calcium changes."],a:1,r:"Serum calcium and phosphorus generally have an inverse relationship."},
{q:"A patient has an elevated serum uric acid level. Which musculoskeletal condition is most closely associated with this finding?",o:["Osteoporosis","Gout","Rhabdomyolysis","Osteomyelitis"],a:1,r:"Elevated uric acid is associated with gout."},
{q:"A patient is scheduled for an arthrocentesis. Which explanation by the nurse is most accurate?",o:["A camera will be inserted into the joint to visualize the structures.","Synovial fluid will be withdrawn from the joint for analysis or to relieve pressure.","A piece of bone will be removed for microscopic examination.","Electrical activity of the muscles will be measured."],a:1,r:"Arthrocentesis withdraws synovial fluid for analysis and/or pressure relief."},
{q:"After an arthrocentesis, which finding should the nurse monitor for and report?",o:["Mild hunger","Increased redness, warmth, bleeding, or bruising at the site","Temporary thirst","Mild fatigue after walking"],a:1,r:"Redness, warmth, bruising, or bleeding can indicate complications at the puncture site."},
{q:"A patient is scheduled for an arthroscopy of the knee. Which statement by the patient shows correct understanding?",o:["The provider will withdraw synovial fluid from my knee.","A small scope will be inserted so the inside of my joint can be directly visualized.","Electrical impulses in my muscles will be measured.","A radioactive substance will be injected to scan my entire skeleton."],a:1,r:"Arthroscopy provides direct visualization of the joint through a small inserted scope."},
{q:"After a knee arthroscopy, the nurse notes the operative leg is warm, red, swollen, and tender. Which complication should the nurse suspect?",o:["Expected postoperative healing","Thrombophlebitis","Normal muscle soreness","Gout"],a:1,r:"Warmth, redness, swelling, tenderness, and pain can indicate thrombophlebitis."},
{q:"After a bone biopsy, which finding is most concerning?",o:["Mild soreness relieved by analgesics","Increased pain that is not relieved by analgesic medication","Small amount of bruising at the site","Temporary fatigue"],a:1,r:"Increasing pain not relieved by analgesics can indicate bleeding into soft tissue after biopsy."},
{q:"Which neurovascular finding should the nurse report immediately after a musculoskeletal injury?",o:["Strong distal pulse","Warm skin with brisk capillary refill","Tingling and paresthesia in the affected extremity","Equal movement bilaterally"],a:2,r:"Tingling or paresthesia may indicate nerve compromise."},
{q:"Which distal pulse finding should the nurse report during a neurovascular assessment?",o:["Pulse equal to the unaffected side","Diminished or absent pulse","Regular pulse at 80/min","Easily palpable pulse"],a:1,r:"A diminished or absent distal pulse can signal impaired circulation."},
{q:"Which skin finding during a neurovascular assessment is most concerning?",o:["Warm skin with normal color","Pallor or cyanosis of the affected extremity","Symmetrical skin temperature","Pink nailbeds with brisk refill"],a:1,r:"Pallor or cyanosis can reflect impaired blood flow."},
{q:"A patient is scheduled for a CT scan with contrast. Which action is most important before the procedure?",o:["Ask whether the patient has a history of reaction to contrast medium","Encourage the patient to eat a high-protein meal","Apply lotion to the extremity being scanned","Have the patient ambulate for 30 minutes"],a:0,r:"A prior contrast reaction is important to identify before contrast-enhanced CT."},
{q:"A patient is scheduled for an MRI. Which finding should the nurse report before the test?",o:["The patient wears reading glasses","The patient has a cardiac implant","The patient ate breakfast","The patient has a history of seasonal allergies"],a:1,r:"Cardiac and orthopedic implants require MRI safety screening."},
{q:"Which diagnostic test is especially useful for identifying soft tissue abnormalities and is more accurate than CT for some vertebral-column problems?",o:["X-ray","MRI","Bone scan","Arthrocentesis"],a:1,r:"MRI is particularly useful for soft tissue and certain vertebral-column abnormalities."},
{q:"A patient is scheduled for a myelogram. Which postprocedure nursing action is appropriate?",o:["Keep the patient completely flat for 12 hours","Monitor for headache and nausea, and limit head elevation to no more than 45° for about 3 hours or as ordered","Encourage immediate ambulation","Apply ice directly to the lumbar puncture site for 24 hours"],a:1,r:"After myelography, monitor for headache and nausea and follow ordered head-elevation restrictions."},
{q:"A patient is scheduled for an electromyography (EMG). Which instruction should the nurse provide?",o:["Apply lotion to the skin before the test","Remove all jewelry and avoid applying lotions before the test","Remain NPO for 8 hours before the test","Expect no discomfort during the procedure"],a:1,r:"Before EMG, avoid lotions and remove jewelry. Slight discomfort or bruising may occur."},
{q:"A patient is scheduled for a nuclear bone scan. Which statement by the patient shows correct understanding?",o:["A radioactive substance will be injected and will collect in areas of bone activity.","A camera will be inserted directly into my joint.","Synovial fluid will be removed from my joint.","The test only examines one small area of bone."],a:0,r:"A radioisotope travels to bone and accumulates in areas of activity, allowing visualization of the skeleton."},
{q:"Which finding on a nuclear bone scan is most concerning?",o:["A ‘hot spot’ in the bone","Even distribution of the radioisotope","Normal bone density","Symmetrical uptake throughout the skeleton"],a:0,r:"A hot spot indicates increased uptake in abnormal bone and can be associated with infection, metastasis, or other bone disease."},
{q:"A patient undergoes an arthrogram of the knee. Which postprocedure instruction is appropriate?",o:["Keep the joint completely immobilized for 72 hours","Apply ice, elevate the limb, and rest the joint for 12–24 hours","Apply heat immediately and begin vigorous ROM exercises","Keep the limb dependent to promote circulation"],a:1,r:"After arthrography, ice, elevation, and joint rest for 12–24 hours are appropriate."},
{q:"Which test is used to directly measure bone strength and is commonly used to diagnose osteoporosis?",o:["DEXA scan","EMG","Arthroscopy","Myelogram"],a:0,r:"DEXA measures bone density/strength and is commonly used to diagnose osteoporosis."},
{q:"Which diagnostic test is specifically used to detect osteomyelitis, soft tissue disorders, traumatic joint injuries, and surgical hardware placement?",o:["Ultrasonography","EMG","Myelogram","Arthrocentesis"],a:0,r:"Musculoskeletal ultrasonography uses sound waves and can detect those conditions."},
{q:"Which finding after a bone or muscle biopsy requires the most immediate follow-up?",o:["Mild bruising at the site","Small amount of tenderness","Increasing swelling with severe pain not relieved by analgesics","Mild fatigue after the procedure"],a:2,r:"Increasing swelling with severe, unrelieved pain can signal bleeding or hematoma formation."},
{q:"A nurse is performing a neurovascular check on a patient with a casted extremity. Which finding is most concerning?",o:["Capillary refill of 2 seconds","Warm skin and palpable pulse","Tight, shiny swelling of the extremity","Mild tenderness at the injury site"],a:2,r:"Tight, shiny swelling is an abnormal vascular finding and can accompany impaired circulation or compartment syndrome."},
{q:"A patient with a fractured leg has a cool foot and a pedal pulse that cannot be palpated. What should the nurse do first?",o:["Reassess in 1 hour","Apply a warm compress","Use a Doppler to assess for the pulse","Elevate the leg above heart level"],a:2,r:"If a distal pulse cannot be palpated, use a Doppler to determine whether a pulse is present."},
{q:"A patient has a faint, weak pedal pulse after a hip fracture. What is the priority nursing action?",o:["Reassess in 4 hours","Encourage ambulation","Notify the RN or HCP immediately","Apply a heating pad"],a:2,r:"A weak distal pulse can reflect limb-threatening impaired circulation and requires immediate escalation."},
{q:"Which finding is most suggestive of synovitis during musculoskeletal palpation?",o:["Swollen synovial tissue within a joint","Complete loss of distal pulses","Dark urine after trauma","Decreased bone density"],a:0,r:"Synovitis is swelling/inflammation of synovial tissue within a joint."},
{q:"Which finding is most consistent with impaired circulation in an injured extremity?",o:["Warm skin with brisk capillary refill","Diminished pulse and delayed capillary refill","Equal muscle strength bilaterally","Normal skin color"],a:1,r:"Diminished pulse and delayed refill are classic signs of impaired circulation."},
{q:"Which finding would the nurse expect with rhabdomyolysis?",o:["Decreased CK and clear urine","Elevated CK and dark urine","Low potassium and bradycardia only","Decreased myoglobin and joint swelling"],a:1,r:"Rhabdomyolysis causes muscle breakdown, often with elevated CK/myoglobin, dark urine, weakness, and myalgia."},
{q:"Which laboratory finding is most closely associated with skeletal muscle destruction?",o:["Decreased uric acid","Increased myoglobin","Decreased alkaline phosphatase","Increased calcium only"],a:1,r:"Myoglobin rises in the blood when skeletal muscle is damaged or destroyed."},
{q:"Which laboratory finding is most associated with gout?",o:["Elevated myoglobin","Elevated uric acid","Elevated CK-MM","Elevated alkaline phosphatase"],a:1,r:"Elevated serum uric acid is associated with gout."},
{q:"Which combination of findings most strongly suggests neurovascular compromise after musculoskeletal surgery?",o:["Warm skin, strong pulse, brisk capillary refill","Cool skin, diminished pulse, delayed capillary refill","Mild tenderness and normal sensation","Equal movement and normal skin color"],a:1,r:"Coolness, a diminished pulse, and delayed capillary refill together strongly suggest impaired circulation."},
{q:"A patient is scheduled for a bone scan. Which instruction is appropriate?",o:["You will need to remain completely still during the scan.","You should apply lotion before the test.","You will need to avoid all fluids for 24 hours.","The test takes only a few minutes."],a:0,r:"The patient may need to lie still for up to about 90 minutes during scanning."},
{q:"Which statement about gallium and thallium scans is correct?",o:["Gallium is used only to evaluate fractures.","Gallium tends to concentrate in tumors, inflammation, and infection, while thallium can detect osteosarcoma.","Thallium is used only for gout.","Both tests measure muscle electrical activity."],a:1,r:"Gallium localizes to tumors, inflammation, and infection; thallium can identify osteosarcoma."},
{q:"A patient returns home after a recent arthrocentesis. Three days later, the nurse notes red streaks that are warm to the touch extending down the affected arm. What is the priority action?",o:["Reassure the patient this is expected","Apply heat and reassess tomorrow","Collect focused data and report the findings to the RN or HCP","Encourage increased range-of-motion exercises"],a:2,r:"Warm red streaking is concerning. Collect focused data and report promptly."},
{q:"A patient who had a left knee arthroscopy has a lower leg that is now warm to the touch. What should the nurse do?",o:["Document it as an expected postoperative finding","Encourage ambulation and reassess later","Perform focused neurovascular assessment and notify the HCP promptly","Apply a heating pad to the leg"],a:2,r:"Post-arthroscopy leg warmth can signal thrombophlebitis or another complication and requires prompt assessment and notification."},
{q:"Which diagnostic test is used to evaluate bone alignment, density, erosion, swelling, and changes in soft tissues related to bone position and spacing?",o:["X-ray","EMG","Arthroscopy","Arthrocentesis"],a:0,r:"X-rays assess bone alignment, density, erosion, swelling, and some soft-tissue changes related to bone position and spacing."},
{q:"A patient is scheduled for a CT scan of the musculoskeletal system. Which finding can this test help identify?",o:["Bone cancer, fractures, damage, and infection","Only muscle electrical activity","Synovial fluid crystals only","Bone strength only"],a:0,r:"CT provides cross-sectional images that can help identify bone cancer, damage, fractures, and infection."},
{q:"Which diagnostic test involves injecting air or contrast medium into a synovial joint and then taking X-rays?",o:["Arthrocentesis","Arthrography","Arthroscopy","Bone scan"],a:1,r:"Arthrography injects air or contrast into a synovial joint before X-ray imaging."},
{q:"A patient has severe joint swelling and excess synovial fluid that is causing pain and decreased mobility. Which procedure would best help relieve the pressure?",o:["Arthroscopy","Arthrocentesis","EMG","DEXA scan"],a:1,r:"Arthrocentesis removes synovial fluid and can reduce pressure, pain, and limited mobility."},
{q:"A home health nurse is evaluating an older adult at risk for falls. Which intervention is most appropriate?",o:["Encourage the patient to keep loose rugs in place for cushioning","Recommend removing loose rugs and request a physical therapy referral if the patient has had recent falls","Rely only on the patient’s report of how well they perform activities of daily living","Discourage the use of assistive devices because they may reduce independence"],a:1,r:"Fall prevention includes removing loose rugs, observing actual function, and requesting PT referral when fall risk or recent falls are present."}
];
let i=0,score=0,answered=false;const misses=[];const letters=['A','B','C','D'];
const app=document.getElementById('app');
function render(){
 if(i>=Q.length){finish();return}
 const x=Q[i],section=i<50?'Round 1: Anatomy, Physiology, Aging & Health History':'Round 2: Physical Examination, Neurovascular Checks & Diagnostics';
 answered=false;
 app.innerHTML=`<div class="top"><span class="pill">${section}</span><span class="pill">Score: ${score}/${i}</span></div><div class="bar"><div class="fill" style="width:${i/Q.length*100}%"></div></div><div class="small">Question ${i+1} of ${Q.length}</div><h2>${x.q}</h2><div class="choices">${x.o.map((c,n)=>`<button class="choice" data-n="${n}"><b>${letters[n]}.</b> ${c}</button>`).join('')}</div><div id="fb" class="feedback"></div><button id="next" class="next">${i===Q.length-1?'See final score':'Next question'}</button>`;
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(Number(b.dataset.n)));
 document.getElementById('next').onclick=()=>{i++;render()};
}
function choose(n){
 if(answered)return;answered=true;const x=Q[i],buttons=[...document.querySelectorAll('.choice')],ok=n===x.a;
 buttons.forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong')});
 if(ok)score++; else misses.push({n:i+1,q:x.q,correct:`${letters[x.a]}. ${x.o[x.a]}`});
 const fb=document.getElementById('fb');fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<b>${ok?'Correct':'Incorrect — correct answer: '+letters[x.a]}</b><br>${x.r}`;
 document.getElementById('next').classList.add('show');
}
function finish(){
 const pct=Math.round(score/Q.length*100);let label=pct>=90?'Excellent':pct>=80?'Strong work':pct>=70?'Keep reviewing':'More review recommended';
 app.innerHTML=`<div class="scorebox"><div class="pill" style="display:inline-block">Completed</div><div class="scorebig">${pct}%</div><h2>${score} / ${Q.length} correct</h2><p>${label}. Review the missed items below, then retake the exam.</p><button class="restart" onclick="restart()">Restart quiz</button></div>${misses.length?`<div class="review"><h3>Missed questions</h3>${misses.map(m=>`<div class="review-item"><b>#${m.n}</b> ${m.q}<br><span class="small">Correct: ${m.correct}</span></div>`).join('')}</div>`:'<p style="text-align:center">Perfect score — no missed questions.</p>'}`;
}
function restart(){i=0;score=0;misses.length=0;render();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script>
