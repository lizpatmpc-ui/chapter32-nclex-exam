<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Med-Surg Final Exam — 75 Questions</title><style>body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033;margin:0;display:grid;place-items:center;min-height:100vh}.box{max-width:620px;margin:24px;padding:28px;background:#fff;border:1px solid #d9deea;border-radius:16px;box-shadow:0 8px 28px rgba(20,35,70,.06)}h1{margin-top:0}.muted{color:#657089}</style></head><body><div class="box"><h1>Loading Med-Surg Final Exam…</h1><p class="muted">75 patient-centered NCLEX / HESI / ATI / Kaplan-style questions with instant feedback and missed-question retake.</p></div><script>(async()=>{try{let s='';for(let i=0;i<11;i++){const r=await fetch(`h${String(i).padStart(2,'0')}.txt`,{cache:'no-store'});if(!r.ok)throw new Error('Missing exam data');s+=await r.text()}document.open();document.write(s);document.close()}catch(e){document.body.innerHTML='<div class="box"><h1>Unable to load exam</h1><p>Please refresh the page.</p></div>';console.error(e)}})();</script></body></html>
